<!DOCTYPE html>
<html>
<head>
  <title>Jewellery Selector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

<h2>Jewellery Selector</h2>

<div class="controls">
  <select id="filter" onchange="render()"></select>
</div>

<div class="grid" id="grid"></div>

<h3 style="text-align:center;">Selected Preview</h3>

<div id="collageContainer">
  <div id="selectedArea"></div>
</div>

<!-- Actions -->
<div class="actions">
  <button class="btn" onclick="generateCollage()">Generate Collage</button>
  <button class="btn" onclick="downloadCollage()">Download</button>
  <button class="btn" onclick="shareCollage()">Share on WhatsApp</button>
</div>

<!-- Spinner -->
<div id="spinner" class="spinner hidden">
  <div class="loader"></div>
  <p>Generating collage...</p>
</div>

<script src="script.js"></script>

</body>
</html>
