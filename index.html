<!DOCTYPE html>
<html>
<head>
  <title>Jewellery Selector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

<h2>Jewellery Selector</h2>

<div class="controls">
  <select id="filter" onchange="render()"></select>
</div>

<div class="grid" id="grid"></div>

<h3 style="text-align:center;">Selected Preview</h3>

<!-- Collage container (IMPORTANT) -->
<div id="collageContainer">
  <div id="selectedArea"></div>
</div>

<button class="btn" onclick="shareCollage()">
  Share Collage Image on WhatsApp
</button>

<script src="script.js"></script>

</body>
</html>
