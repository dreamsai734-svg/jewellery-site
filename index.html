<!DOCTYPE html>
<html>
<head>
  <title>Jewellery Selector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f7f7f7;
    }

    h2 { text-align: center; }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    select, input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card.selected {
      border: 3px solid green;
    }

    img {
      width: 100%;
      border-radius: 8px;
    }

    #selectedArea {
      margin-top: 20px;
      text-align: center;
    }

    #selectedArea img {
      width: 80px;
      margin: 5px;
      border-radius: 6px;
      border: 2px solid #ccc;
    }

    .whatsapp-btn {
      margin-top: 20px;
      display: block;
      width: 240px;
      margin-left: auto;
      margin-right: auto;
      background: #25D366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

  </style>
</head>

<body>

<h2>Jewellery Selector</h2>

<div class="controls">
  <select id="filter" onchange="render()"></select>
</div>

<div class="controls">
  <input id="phoneNumber" type="text" placeholder="Enter WhatsApp number (e.g. 91XXXXXXXXXX)" style="width:300px;">
</div>

<div class="grid" id="grid"></div>

<h3 style="text-align:center;">Selected Preview</h3>
<div id="selectedArea"></div>

<button class="whatsapp-btn" onclick="sendWhatsApp()">
  Send to WhatsApp
</button>

<script>
let data = [];
let selected = [];

const API_URL = "https://script.google.com/macros/s/AKfycbxurQyyCGIRT2nTBTEZJMBi3lCuAHH1j3wC3vOjk7d3gAqqTiFVIgMyw37pvt6E4Q/exec";

fetch(API_URL)
.then(res => res.json())
.then(json => {
  data = json;
  initFilter();
  render();
});

function initFilter() {
  let types = [...new Set(data.map(d => d["Type"]))];
  let filter = document.getElementById("filter");

  filter.innerHTML = '<option value="">All</option>' +
    types.map(t => `<option value="${t}">${t}</option>`).join("");
}

function convertToThumbnail(url) {
  if (!url) return "";

  if (url.includes("drive.google.com")) {
    let match = url.match(/id=([a-zA-Z0-9_-]+)/);
    if (match) {
      return "https://drive.google.com/thumbnail?id=" + match[1];
    }
  }

  return url;
}

function render() {
  let filterValue = document.getElementById("filter").value;

  let filtered = data.filter(d => !filterValue || d["Type"] === filterValue);

  let html = "";

  filtered.forEach(item => {
    let isSelected = selected.includes(item["Serial No"]);
    let imgUrl = convertToThumbnail(item.URL);

    html += `
      <div class="card ${isSelected ? 'selected' : ''}" onclick='toggle("${item["Serial No"]}")'>
        <img src="${imgUrl}">
        <p>${item["Serial No"]}</p>
        <small>${item["Type"]}</small>
      </div>
    `;
  });

  document.getElementById("grid").innerHTML = html;
  renderSelected();
}

function toggle(id) {
  if (selected.includes(id)) {
    selected = selected.filter(x => x !== id);
  } else {
    selected.push(id);
  }
  render();
}

function renderSelected() {
  let area = document.getElementById("selectedArea");
  let html = "";

  data.filter(d => selected.includes(d["Serial No"]))
      .forEach(item => {
        let imgUrl = convertToThumbnail(item.URL);
        html += `<img src="${imgUrl}" title="${item["Serial No"]}">`;
      });

  area.innerHTML = html;
}

function sendWhatsApp() {
  let phone = document.getElementById("phoneNumber").value.trim();

  if (!phone) {
    alert("Please enter WhatsApp number with country code");
    return;
  }

  let text = "Selected Jewellery:\n\n";

  data.filter(d => selected.includes(d["Serial No"]))
      .forEach(item => {
        text += item["Serial No"] + "\n" + item.URL + "\n\n";
      });

  let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);

  window.open(url);
}
</script>

</body>
</html>
