<!DOCTYPE html>
<html>
<head>
  <title>Jewellery Selector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f7f7f7;
    }

    h2 { text-align: center; }

    .controls {
      text-align: center;
      margin-bottom: 15px;
    }

    select {
      padding: 10px;
      border-radius: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .card {
      background: white;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .card.selected {
      border: 3px solid green;
    }

    img {
      width: 100%;
      border-radius: 6px;
    }

    #selectedArea {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .collage-item {
      position: relative;
    }

    .collage-item img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .label {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 12px;
      text-align: center;
    }

    .actions {
      text-align: center;
      margin-top: 15px;
    }

    button {
      padding: 10px 14px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      background: #25D366;
      color: white;
      cursor: pointer;
    }

    #spinner {
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.6);
      color:white;
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }
  </style>
</head>

<body>

<h2>Jewellery Selector</h2>

<div class="controls">
  <select id="filter" onchange="render()"></select>
</div>

<div class="grid" id="grid"></div>

<h3 style="text-align:center;">Preview</h3>

<div id="collageContainer">
  <div id="selectedArea"></div>
</div>

<div class="actions">
  <button onclick="generateCollage()">Generate</button>
  <button onclick="downloadCollage()">Download</button>
  <button onclick="shareCollage()">WhatsApp</button>
</div>

<div id="spinner">
  <h3>Generating collage...</h3>
</div>

<script>
let data = [];
let selected = [];
let lastCanvas = null;

/* ================= API ================= */

const API_URL = "https://script.google.com/macros/s/AKfycbxiqDaqYYvxAyT5S9bp3uoJDtnrlrhB_xYX_eM-wiq4as_j2vIfky2QOmqGIk-drKE/exec";

/* ================= FETCH DATA ================= */

fetch(API_URL)
.then(res => res.json())
.then(json => {
  console.log("API Data:", json);
  data = json;
  initFilter();
  render();
})
.catch(err => console.error("API error:", err));

/* ================= FILTER ================= */

function initFilter() {
  let types = [...new Set(data.map(d => d["Type"]))];
  let filter = document.getElementById("filter");

  filter.innerHTML = '<option value="">All</option>' +
    types.map(t => `<option value="${t}">${t}</option>`).join("");
}

/* ================= DRIVE URL FIX ================= */

function convertToThumbnail(url) {
  if (!url) return "";

  let match = url.match(/[-\w]{25,}/);
  if (match) {
    return "https://drive.google.com/uc?export=view&id=" + match[0];
  }

  return url;
}

/* ================= RENDER GRID ================= */

function render() {
  let filterValue = document.getElementById("filter").value;

  let filtered = data.filter(d => !filterValue || d["Type"] === filterValue);

  let html = "";

  filtered.forEach(item => {
    let isSelected = selected.includes(item["Serial No"]);
    let imgUrl = convertToThumbnail(item.URL);

    html += `
      <div class="card ${isSelected ? 'selected' : ''}" onclick='toggle("${item["Serial No"]}")'>
        <img src="${imgUrl}">
        <p>${item["Serial No"]}</p>
        <small>${item["Type"]}</small>
      </div>
    `;
  });

  document.getElementById("grid").innerHTML = html;
  renderSelected();
}

/* ================= SELECT ================= */

function toggle(id) {
  if (selected.includes(id)) {
    selected = selected.filter(x => x !== id);
  } else {
    if (selected.length >= 9) {
      alert("Max 9 allowed");
      return;
    }
    selected.push(id);
  }
  render();
}

/* ================= PREVIEW ================= */

function renderSelected() {
  let area = document.getElementById("selectedArea");

  area.innerHTML = data
    .filter(d => selected.includes(d["Serial No"]))
    .map(item => {
      let imgUrl = convertToThumbnail(item.URL);
      return `
        <div class="collage-item">
          <img src="${imgUrl}">
          <div class="label">${item["Serial No"]}</div>
        </div>
      `;
    }).join("");
}

/* ================= COLLAGE ================= */

async function generateCollage() {
  if (selected.length === 0) {
    alert("Select items first");
    return;
  }

  document.getElementById("spinner").style.display = "flex";

  const container = document.getElementById("collageContainer");

  const images = container.querySelectorAll("img");

  await Promise.all([...images].map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.onload = img.onerror = resolve;
    });
  }));

  try {
    const canvas = await html2canvas(container, {
      scale: 2,
      backgroundColor: "#ffffff"
    });

    lastCanvas = canvas;

  } catch (err) {
    console.error("Collage error:", err);
    alert("Error generating collage");
  }

  document.getElementById("spinner").style.display = "none";
}

/* ================= DOWNLOAD ================= */

function downloadCollage() {
  if (!lastCanvas) {
    alert("Generate first");
    return;
  }

  const link = document.createElement("a");
  link.download = "collage.png";
  link.href = lastCanvas.toDataURL();
  link.click();
}

/* ================= SHARE ================= */

async function shareCollage() {
  if (!lastCanvas) {
    alert("Generate first");
    return;
  }

  lastCanvas.toBlob(async blob => {
    const file = new File([blob], "collage.png", { type: "image/png" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
    } else {
      fallbackShare();
    }
  });
}

function fallbackShare() {
  let text = "Jewellery:\n\n";

  data.filter(d => selected.includes(d["Serial No"]))
      .forEach(d => {
        text += d["Serial No"] + "\n";
      });

  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
</script>

</body>
</html>
